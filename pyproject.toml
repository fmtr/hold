[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "0.1.2"
port = 4
base = "python"
description = "A small, rule-driven DNS server for home labs"
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_client = false
services = []
keywords = ["dns", "ad blocking", "home lab", "rewrite", "dns over https"]
is_pypi = true
is_dockerhub = false

[tool.corio.metadata.setup]

[tool.setuptools.packages.find]
where = ["."]
include = ["hold*"]
namespaces = false

[tool.setuptools.package-data]
hold = ["pyproject.package.toml", "assets/**"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1"]
env_list = ["hold"]

[tool.tox.env.hold]
description = "Run hold tests."
deps = ["pytest", "pytest-asyncio"]
commands = [["python", "-m", "pytest", "-q", "hold/tests"]]

[project]
name = "hold"
version = "0.1.2"
description = "A small, rule-driven DNS server for home labs"
readme = "README.md"
license = "Apache-2.0"
keywords = ["dns", "ad blocking", "home lab", "rewrite", "dns over https"]
requires-python = ">=3.14"
dependencies = ["corio[api,caching,debug,dns,http,logging,patterns,sets,version.dev,yaml]~=2.8.22"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.urls]
Homepage = "https://github.com/fmtr/hold"
Documentation = "https://fmtr.github.io/hold"
Repository = "https://github.com/fmtr/hold"
Issues = "https://github.com/fmtr/hold/issues"

[project.scripts]
hold = "hold.entrypoint:main"
