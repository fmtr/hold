[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "0.0.22-alpha008"
port = 4
base = "python"
description = "Homelab AdBlocking DNS Server"
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_client = false
services = []
keywords = []
is_pypi = false
is_dockerhub = false

[[tool.corio.metadata.docs.nav]]
Home = "index.md"

[[tool.corio.metadata.docs.nav]]
Changelog = "changelog/"

[tool.corio.metadata.setup]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["fmtr.dns*"]
namespaces = true

[tool.setuptools.package-data]
"fmtr.dns" = ["pyproject.package.toml"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1"]
env_list = ["fmtr.dns"]

[tool.tox.env."fmtr.dns"]
description = "Run fmtr.dns tests."
deps = ["pytest", "pytest-asyncio"]
commands = [["python", "-m", "pytest", "-q", "fmtr/dns/tests"]]

[project]
name = "fmtr.dns"
version = "0.0.22-alpha008"
description = "Homelab AdBlocking DNS Server"
readme = "README.md"
license = "Apache-2.0"
keywords = []
requires-python = ">=3.14"
dependencies = ["corio[api,caching,debug,dns,http,logging,patterns,sets,version.dev,yaml]~=2.6.4-alpha011"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.urls]
Homepage = "https://github.com/fmtr/fmtr.dns"

[project.scripts]
fmtr-dns = "fmtr.dns.entrypoint:main"
